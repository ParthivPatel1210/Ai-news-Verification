{% extends 'base.html' %}
{% block title %}Login — AI NewsVerifier{% endblock %}

{% block content %}
<div class="auth-shell">

  <!-- ── LEFT DECORATIVE PANEL ── -->
  <div class="auth-deco">
    <!-- The background image handles the visual here now -->
  </div>

  <!-- ── RIGHT FORM PANEL ── -->
  <div class="auth-form-side">
    <div class="auth-form-inner">

      <div class="auth-form-heading">SIGN IN</div>
      <div class="auth-form-sub">Sign in with email address</div>

      <form method="post" action="/login" autocomplete="on">

        <div class="auth-field">
          <label class="auth-label" for="login-username">Username or Email</label>
          <div class="auth-input-wrap">
            <i class="bi bi-envelope auth-input-icon"></i>
            <input
              id="login-username"
              name="username"
              class="auth-input"
              placeholder="Yourname@gmail.com"
              required
              autocomplete="username" />
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="login-password">Password</label>
          <div class="auth-input-wrap">
            <i class="bi bi-lock auth-input-icon"></i>
            <input
              id="login-password"
              name="password"
              type="password"
              class="auth-input"
              placeholder="••••••••"
              required
              autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="auth-btn">
          Sign In
        </button>
      </form>

      <hr class="auth-divider" />
      
      <div class="social-buttons">
        <button type="button" class="social-btn social-btn-google">
          <i class="bi bi-google"></i> Google
        </button>
        <button type="button" class="social-btn social-btn-facebook">
          <i class="bi bi-facebook"></i> Facebook
        </button>
      </div>

      <div class="auth-footer-text" style="font-size: 0.75rem; margin-top: 16px;">
        By registering you agree with our <a href="#">Terms and Conditions</a><br><br>
        <span style="font-size: 0.9rem;">Don't have an account? <a href="/signup">Create one for free &rarr;</a></span>
      </div>

    </div>
  </div>

</div>
{% endblock %}

{% block head %}
<style>
  /* Make auth shell fill viewport minus navbar */
  .auth-shell { min-height: calc(100vh - 68px); }
</style>
{% endblock %}
