{% extends 'base.html' %}
{% block title %}Sign Up — AI NewsVerifier{% endblock %}

{% block content %}
<div class="auth-shell">

  <!-- ── LEFT DECORATIVE PANEL ── -->
  <div class="auth-deco">
    <!-- The background image handles the visual here now -->
  </div>

  <!-- ── RIGHT FORM PANEL ── -->
  <div class="auth-form-side">
    <div class="auth-form-inner">

      <div class="auth-form-heading">Create your account</div>
      <div class="auth-form-sub">Join thousands of readers fighting misinformation.</div>

      <form method="post" action="/signup" autocomplete="on">

        <div class="auth-field">
          <label class="auth-label" for="signup-username">Username</label>
          <div class="auth-input-wrap">
            <i class="bi bi-person auth-input-icon"></i>
            <input id="signup-username" name="username" class="auth-input" placeholder="Username" required autocomplete="username" />
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-email">Email address</label>
          <div class="auth-input-wrap">
            <i class="bi bi-envelope auth-input-icon"></i>
            <input id="signup-email" name="email" type="email" class="auth-input" placeholder="Email Address" required autocomplete="email" />
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-password">Password</label>
          <div class="auth-input-wrap">
            <i class="bi bi-lock auth-input-icon"></i>
            <input id="signup-password" name="password" type="password" class="auth-input" placeholder="Create a strong password" required autocomplete="new-password" oninput="checkPwStrength(this.value)" />
          </div>
          <!-- Password strength bar -->
          <div style="margin-top:8px;height:4px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;">
            <div id="pw-strength-bar" style="height:100%;width:0%;border-radius:99px;background:#ef4444;transition:width 0.4s,background 0.4s;"></div>
          </div>
          <div id="pw-strength-text" style="font-size:0.75rem;color:#64748b;margin-top:6px;"></div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-confirm-password">Confirm Password</label>
          <div class="auth-input-wrap">
            <i class="bi bi-lock-fill auth-input-icon"></i>
            <input id="signup-confirm-password" name="confirm_password" type="password" class="auth-input" placeholder="Repeat your password" required autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="auth-btn">
          Create Account
        </button>
      </form>

      <hr class="auth-divider" />
      
      <div class="social-buttons">
        <button type="button" class="social-btn social-btn-google">
          <i class="bi bi-google"></i> Google
        </button>
        <button type="button" class="social-btn social-btn-facebook">
          <i class="bi bi-facebook"></i> Facebook
        </button>
      </div>

      <div class="auth-footer-text">
        Already have an account? <a href="/login">Sign in instead &rarr;</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block head %}
<style>
  .auth-shell { min-height: calc(100vh - 68px); }
</style>
{% endblock %}

{% block scripts %}
<script>
  function checkPwStrength(val) {
    const bar  = document.getElementById('pw-strength-bar');
    const text = document.getElementById('pw-strength-text');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { pct: '15%', color: '#ef4444', label: 'Too weak' },
      { pct: '35%', color: '#f97316', label: 'Weak' },
      { pct: '65%', color: '#eab308', label: 'Fair' },
      { pct: '85%', color: '#22c55e', label: 'Strong' },
      { pct: '100%',color: '#10b981', label: 'Very strong' },
    ];
    const lvl = val.length === 0 ? { pct:'0%',color:'#ef4444',label:'' } : levels[score] || levels[0];
    bar.style.width  = lvl.pct;
    bar.style.background = lvl.color;
    text.textContent = lvl.label;
    text.style.color = lvl.color;
  }
</script>
{% endblock %}
